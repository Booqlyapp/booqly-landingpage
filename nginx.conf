# Booqly Website - Wildcard Subdomain Configuration
# This handles all *.booqlyapp.com subdomains for custom booking links

server {
    listen 80;
    server_name booqlyapp.com www.booqlyapp.com *.booqlyapp.com;

    # Prevent api subdomain from being handled here (handled by separate config)
    if ($host = "api.booqlyapp.com") {
        return 444;
    }

    # Prevent admin subdomain from being handled here
    if ($host = "admin.booqlyapp.com") {
        return 444;
    }

    # Proxy all requests to Next.js application running on port 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Next.js static files
    location /_next/static {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 60m;
    }

    # Favicon and other static assets
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3001;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/booqly-website-access.log;
    error_log /var/log/nginx/booqly-website-error.log;
}

